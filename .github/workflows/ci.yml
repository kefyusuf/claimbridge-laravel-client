name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Code style (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress
      - name: Run tests
        run: vendor/bin/phpunit

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install client dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Clone and install the sandbox
        run: |
          git clone --depth 1 https://github.com/kefyusuf/claimbridge-sandbox.git /tmp/sandbox
          cd /tmp/sandbox
          npm install -g pnpm
          pnpm install --frozen-lockfile
      - name: Start the sandbox HTTP service
        run: |
          cd /tmp/sandbox
          nohup node scripts/serve.mjs --port 8123 > /tmp/sandbox.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -X POST http://127.0.0.1:8123/sessions; then
              echo "sandbox up"; exit 0
            fi
            sleep 1
          done
          cat /tmp/sandbox.log
          exit 1
      - name: Run the real end-to-end claim flow
        run: vendor/bin/phpunit --filter SandboxIntegrationTest
        env:
          SANDBOX_URL: http://127.0.0.1:8123
